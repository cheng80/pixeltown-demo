<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8fd0f2">
  <title>접속 안내 · 픽셀타운</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:#8fd0f2 radial-gradient(rgba(255,255,255,.55) 1.5px,transparent 2px) 0 0/16px 16px;color:#3a2440;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:14px;line-height:1.75}
    main{width:min(440px,100%);background:#fffafc;border:3px solid #3a2440;box-shadow:inset 0 0 0 3px #ffe3ee,0 6px 0 rgba(58,36,64,.45);padding:28px 24px 22px;text-align:center}
    svg{width:56px;height:40px;display:block;margin:0 auto 6px}
    h1{margin:6px 0 12px;font-size:22px;line-height:1.4;font-weight:700}
    p{margin:0 0 10px;color:#6c5a72}
    a{display:block;margin-top:18px;padding:12px 18px;border:3px solid #3a2440;background:#ff5c93;color:#fff;font-weight:700;font-size:16px;text-decoration:none;text-shadow:1px 1px 0 #d93a73;box-shadow:inset -4px -4px 0 #d93a73,inset 4px 4px 0 #ffa3c4,0 4px 0 #3a2440}
    a:active{transform:translateY(3px);box-shadow:inset -4px -4px 0 #d93a73,inset 4px 4px 0 #ffa3c4,0 1px 0 #3a2440}
    a:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
    small{display:block;margin-top:18px;padding-top:12px;border-top:2px dashed #e3d4ff;color:#7a6680;font-size:12px}
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 15 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3a2440" d="M4 0h4v1H4zM10 1h3v1h-3zM3 1h1v1H3zM8 1h1v1H8zM9 2h1v1H9zM13 2h1v1h-1zM1 2h2v1H1zM0 3h1v2H0zM14 3h1v2h-1zM1 5h13v1H1z"/><path fill="#fff" d="M4 1h4v1H4zM3 2h6v1H3zM10 2h3v1h-3zM1 3h13v2H1z"/></svg>
    <h1>광장에 잠시 연결할 수 없어요</h1>
    <p>연결이 불안정하거나 광장을 준비하고 있을 수 있어요. 잠시 후 다시 입장해 주세요.</p>
    <p>이미 저장된 별은 다시 연결한 뒤 확인할 수 있어요. 정산을 기다리는 별은 저장 확인이 끝나야 반영돼요.</p>
    <a href="./">다시 입장하기</a>
    <small>요청이 많다는 안내를 보셨다면 잠시 기다려 주세요. 브라우저 데이터를 지우지 않아도 돼요.</small>
  </main>

</html>
